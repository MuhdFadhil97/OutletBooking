name: outletbooking

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: outlet
      POSTGRES_PASSWORD: outlet
      POSTGRES_DB: outletbooking
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outlet -d outletbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible file storage (booking photos). RustFS replaces MinIO, whose Docker images are
  # no longer published; the API only speaks S3, so any S3 server (MinIO, R2, Supabase) works.
  s3:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: outlet
      RUSTFS_SECRET_KEY: outletminio
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - s3data:/data

  # Optional: `docker compose --profile tools up -d` (or use pgAdmin installed on Windows)
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@outletbooking.local
      PGADMIN_DEFAULT_PASSWORD: outlet
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  s3data:
