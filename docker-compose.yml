name: outletbooking

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: outlet
      POSTGRES_PASSWORD: outlet
      POSTGRES_DB: outletbooking
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outlet -d outletbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: outlet
      MINIO_ROOT_PASSWORD: outletminio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data

  # Optional: `docker compose --profile tools up -d` (or use pgAdmin installed on Windows)
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@outletbooking.local
      PGADMIN_DEFAULT_PASSWORD: outlet
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  miniodata:
